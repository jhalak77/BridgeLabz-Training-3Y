<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Personal Portfolio Basics</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q2-portfolio.css">
</head>
<body class="bg-light text-dark py-5">
    <main class="container">
        <!-- Profile Header -->
        <header class="text-center p-5 bg-white rounded shadow-sm mb-4">
            <img src="https://picsum.photos/150/150" alt="Profile Image" class="img-fluid rounded-circle mb-3 border border-3 border-primary">
            <h1 class="fw-bold">Alex Morgan</h1>
            <p class="text-muted lead">Full-Stack Web Developer & UI/UX Designer</p>
            
            <!-- Action Buttons -->
            <div class="d-flex justify-content-center gap-2 mt-3">
                <a href="#contact" class="btn btn-primary">Hire Me</a>
                <a href="#" class="btn btn-outline-secondary">Download CV</a>
            </div>
        </header>

        <!-- Small Contact Form -->
        <section id="contact" class="bg-white p-4 rounded shadow-sm mx-auto" style="max-width: 600px;">
            <h3 class="text-center fw-bold mb-3">Get in Touch</h3>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" class="form-control" rows="3" placeholder="Write your message..."></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Send Message</button>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
