<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7 - Task Tracker with Badges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q7-task-tracker.css">
</head>
<body class="bg-light py-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <!-- Header with Badge Counter -->
                <header class="d-flex justify-content-between align-items-center bg-white p-4 rounded shadow-sm mb-4">
                    <h1 class="h3 fw-bold mb-0">Project Task Tracker</h1>
                    <span class="badge bg-danger fs-6 rounded-pill px-3 py-2">3 Pending Tasks</span>
                </header>

                <!-- Tasks List Group -->
                <ul class="list-group shadow-sm mb-4">
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div>
                            <span class="fw-semibold">Fix responsive navbar collapse bug</span>
                            <div class="small text-muted">Assigned to Frontend Team</div>
                        </div>
                        <span class="badge bg-danger rounded-pill">High Priority</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div>
                            <span class="fw-semibold">Update database schema documentation</span>
                            <div class="small text-muted">Assigned to Backend Team</div>
                        </div>
                        <span class="badge bg-warning text-dark rounded-pill">Medium Priority</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        <div>
                            <span class="fw-semibold">Refactor old CSS stylesheets</span>
                            <div class="small text-muted">Assigned to UI Team</div>
                        </div>
                        <span class="badge bg-success rounded-pill">Low Priority</span>
                    </li>
                </ul>

                <!-- Completed Button with Embedded Badge -->
                <div class="text-end">
                    <button class="btn btn-outline-secondary">
                        Completed Tasks <span class="badge bg-secondary ms-1">12</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
