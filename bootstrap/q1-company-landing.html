<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Company Landing Page</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="q1-company-landing.css">
</head>
<body>
    <!-- Full-width header & Navbar -->
    <header class="bg-dark text-white py-3">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <a class="navbar-brand fw-bold" href="#">NexusTech</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero Section using .container, .row, and .col -->
    <main class="py-5 bg-light flex-grow-1 d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-12 col-lg-6 text-center text-lg-start">
                    <h1 class="display-4 fw-bold text-dark">Empowering Your Digital Future</h1>
                    <p class="lead text-secondary my-3">We deliver cutting-edge cloud and AI solutions to scale your business effortlessly across global markets.</p>
                    <a href="#" class="btn btn-primary btn-lg shadow-sm">Get Started</a>
                </div>
                <div class="col-12 col-lg-6 text-center">
                    <img src="https://picsum.photos/600/400" alt="Hero Illustration" class="img-fluid rounded shadow">
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
